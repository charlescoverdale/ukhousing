# Weekly live-data check. Runs the full test suite, including the tests
# that reach Land Registry, ONS and planning.data.gov.uk, on a fresh
# runner with an empty cache. CRAN skips those tests, so a source that
# moves a file, renames a column or stops updating would otherwise
# surface only in a user's session.
name: live-data

on:
  schedule:
    - cron: "52 5 * * 1"
  workflow_dispatch:

jobs:
  live-data:
    runs-on: ubuntu-latest
    env:
      NOT_CRAN: "true"
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      UKHOUSING_LIVE_TESTS: "true"
      EPC_EMAIL: ${{ secrets.EPC_EMAIL }}
      EPC_API_KEY: ${{ secrets.EPC_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat, any::pkgload
          needs: check

      - name: Run tests against live sources
        run: testthat::test_local(".", reporter = "summary", stop_on_failure = TRUE)
        shell: Rscript {0}
